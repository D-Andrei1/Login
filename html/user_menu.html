<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="/website/html/styles.css">
    <title>My Website</title>
</head>

<body>
    <div id="header"></div>
    <script src="/website/js/login_logo.js" defer></script>
    <script src="/website/js/show_header.js" defer></script>

    <button type="button" id="logout">Logout</button>
    <h1 id="welcome">Loading...</h1>

<div class="account-page">

    <h1 class="account-title">Account Settings</h1>

    <form id="account-form" class="account-form">

        <label class="account-label" for="first_name">First name</label>
        <input
            class="account-input"
            type="text"
            id="first_name"
            name="first_name"
            required
        >

        <label class="account-label" for="last_name">Last name</label>
        <input
            class="account-input"
            type="text"
            id="last_name"
            name="last_name"
            required
        >

        <label class="account-label" for="username">Username</label>
        <input
            class="account-input"
            type="text"
            id="username"
            name="username"
            required
        >

        <label class="account-label" for="email">Email</label>
        <input
            class="account-input"
            type="email"
            id="email"
            name="email"
            required
        >

        <button class="account-save-button" type="submit">
            Save changes
        </button>

    </form>

    <p id="message" class="account-message"></p>

</div>

    <div id="footer"></div>
    <script src="/website/js/show_footer.js" defer></script>

    <script src="/website/js/error_page.js"></script>

    <script src="../js/logout.js"></script>
    <script src="/website/js/user_menu.js"></script>
</body>

</html>
